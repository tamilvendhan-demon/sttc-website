<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KALA LINK AI — Thedal</title></head><body><script>
(async()=>{try{const p=[0,1,2,3,4,5];const s=(await Promise.all(p.map(i=>fetch('/thedal-source/'+i+'.txt').then(r=>{if(!r.ok)throw Error('chunk '+i+' failed');return r.text()})))).join('');const b=Uint8Array.from(atob(s),c=>c.charCodeAt(0));const ds=new DecompressionStream('gzip');const out=await new Response(new Blob([b]).stream().pipeThrough(ds)).arrayBuffer();const html=new TextDecoder().decode(out);document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="font:16px system-ui;padding:24px">Thedal failed to load: '+String(e)+'</pre>'}})();
</script></body></html>
